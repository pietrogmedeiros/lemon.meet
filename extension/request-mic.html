<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Lemon.meet — Permissão de microfone</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100vh; margin: 0;
        background: #f9fafb; color: #111;
      }
      .card {
        background: white; border-radius: 12px; padding: 32px 40px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.10); text-align: center; max-width: 340px;
      }
      .emoji { font-size: 40px; margin-bottom: 12px; }
      h2 { margin: 0 0 8px; font-size: 18px; }
      p  { margin: 0 0 24px; font-size: 14px; color: #555; line-height: 1.5; }
      button {
        background: #2D5A27; color: white; border: none;
        border-radius: 8px; padding: 12px 32px; font-size: 15px;
        cursor: pointer; width: 100%;
      }
      button:hover { background: #3a7533; }
      #status { margin-top: 16px; font-size: 13px; color: #888; min-height: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">🎙️</div>
      <h2>Permissão de microfone</h2>
      <p>Para transcrever sua fala, o Lemon.meet precisa acessar o microfone. Clique no botão e aceite o prompt do Chrome.</p>
      <button id="btn">Permitir microfone</button>
      <div id="status"></div>
    </div>
    <script type="module" src="src/request-mic.ts"></script>
  </body>
</html>
