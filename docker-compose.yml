services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: vibe-ai-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SOCKET_IO_CORS_ORIGIN=${SOCKET_IO_CORS_ORIGIN:-http://localhost:5173}
      - MAX_CONCURRENT_MEETINGS=${MAX_CONCURRENT_MEETINGS:-5}
      - MEETING_TIMEOUT_MS=${MEETING_TIMEOUT_MS:-7200000}
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - vibe-ai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
        - VITE_API_URL=http://localhost:3000
    container_name: vibe-ai-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - vibe-ai-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  vibe-ai-network:
    driver: bridge
